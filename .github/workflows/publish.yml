name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm OIDC trusted publishing
  contents: write # required to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm CLI >=11.5.1, which ships with Node 24.
          # Node 22 bundles npm 10, which cannot perform the OIDC handshake: npm
          # silently publishes anonymously and the registry rejects it with a
          # misleading "404 Not Found - PUT" rather than an auth error.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Printed so a future auth failure can be diagnosed from the log alone.
      - run: node --version && npm --version

      - run: npm ci

      - run: npm run build

      - run: npm publish --access public

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
